# tasks file for gitlab
- name: Validate GitLab root password is provided
  ansible.builtin.assert:
    that:
      - gitlab_root_password | length >= 8
    fail_msg: "Set gitlab_root_password in Ansible Vault and make it at least 8 characters long."

- name: Validate GitLab bootstrap PAT token is provided
  ansible.builtin.assert:
    that:
      - gitlab_bootstrap_pat_token | length >= 20
    fail_msg: "Set gitlab_api_token or gitlab_bootstrap_pat_token in Ansible Vault. GitLab PAT values must be at least 20 characters."
  when: gitlab_bootstrap_create_pat | bool

- name: Install GitLab prerequisites
  apt:
    name:
      - curl
      - ca-certificates
      - openssh-server
      - tzdata
      - perl
    state: present
    update_cache: yes
    lock_timeout: 300

- name: Download GitLab package repository installer
  get_url:
    url: "{{ gitlab_repo_script_url }}"
    dest: /tmp/gitlab_repo.sh
    mode: "0755"

- name: Register GitLab package repository
  command: bash /tmp/gitlab_repo.sh
  args:
    creates: /etc/apt/sources.list.d/gitlab_gitlab-ce.list

- name: Install GitLab CE
  apt:
    name: "{{ gitlab_package_name }}"
    state: present
    update_cache: yes
    lock_timeout: 300
  environment:
    EXTERNAL_URL: "{{ gitlab_external_url }}"
    GITLAB_REGISTRY_EXTERNAL_URL: "{{ gitlab_registry_external_url }}"
    GITLAB_ROOT_EMAIL: "{{ gitlab_root_email }}"
    GITLAB_ROOT_PASSWORD: "{{ gitlab_root_password }}"
  no_log: "{{ gitlab_hide_sensitive_logs | bool }}"

- name: Configure GitLab external URL
  ansible.builtin.lineinfile:
    path: /etc/gitlab/gitlab.rb
    regexp: "^external_url "
    line: "external_url '{{ gitlab_external_url }}'"
    create: yes
    owner: root
    group: root
    mode: "0600"
  register: gitlab_external_url_config

- name: Configure GitLab registry external URL
  ansible.builtin.lineinfile:
    path: /etc/gitlab/gitlab.rb
    regexp: "^registry_external_url "
    line: "registry_external_url '{{ gitlab_registry_external_url }}'"
    create: yes
    owner: root
    group: root
    mode: "0600"
  register: gitlab_registry_url_config

- name: Reconfigure GitLab after URL changes
  ansible.builtin.command: gitlab-ctl reconfigure
  when: gitlab_external_url_config.changed or gitlab_registry_url_config.changed

- name: Wait for GitLab Rails to be available
  ansible.builtin.command: gitlab-rails runner "puts 'ready'"
  register: gitlab_rails_ready
  changed_when: false
  retries: 30
  delay: 10
  until: gitlab_rails_ready.rc == 0

- name: Render GitLab bootstrap script
  ansible.builtin.template:
    src: bootstrap_root_and_pat.rb.j2
    dest: "{{ gitlab_bootstrap_script_path }}"
    owner: git
    group: git
    mode: "0600"
  no_log: "{{ gitlab_hide_sensitive_logs | bool }}"
  notify: Bootstrap GitLab root account and API token
