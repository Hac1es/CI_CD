---
# tasks file for envoy
- name: Install Docker and unzip
  ansible.builtin.apt:
    name:
      - docker.io
      - unzip
    state: present
    update_cache: yes

- name: Ensure docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Ensure envoy config directory exists
  ansible.builtin.file:
    path: /etc/envoy
    state: directory
    mode: "0755"

- name: Create Envoy reverse proxy config with Coraza WASM filter
  ansible.builtin.template:
    src: envoy.yaml.j2
    dest: "{{ envoy_config_path }}"
    mode: "0644"
  notify: Restart envoy container

- name: Pull Envoy image
  ansible.builtin.command: docker pull {{ envoy_image }}
  register: envoy_pull
  changed_when: "'Image is up to date' not in envoy_pull.stdout"

- name: Run Envoy container if missing
  ansible.builtin.shell: |
    if ! docker ps -a --format '{% raw %}{{.Names}}{% endraw %}' | grep -qx "{{ envoy_container_name }}"; then
      docker run -d --name {{ envoy_container_name }} --restart unless-stopped --network host \
        -v {{ envoy_config_path }}:{{ envoy_config_path }}:ro \
        -v {{ envoy_wasm_path }}:{{ envoy_wasm_path }}:ro \
        {{ envoy_image }} -c {{ envoy_config_path }}
      echo created
    elif ! docker ps --format '{% raw %}{{.Names}}{% endraw %}' | grep -qx "{{ envoy_container_name }}"; then
      docker start {{ envoy_container_name }}
      echo started
    else
      echo unchanged
    fi
  register: envoy_container_run
  changed_when: "envoy_container_run.stdout is search('created|started')"
