---
# Bước 1: Cấu hình Gateway/Bastion để làm reverse proxy và SSL termination sau này
- name: Configure Public Edge Proxy (Bastion)
  hosts: proxy_bastion
  become: yes
  roles:
    - bastion_gateway
    - bastion_nginx

# Bước 2: Setup Jenkins Server làm CI Engine
- name: Configure CI Engine (Jenkins)
  hosts: jenkins
  become: yes
  roles:
    - jenkins

# Bước 3: Setup Harbor Secure Registry làm nơi lưu trữ và quét mã độc Image
- name: Configure Private Secure Registry (Harbor)
  hosts: harbor
  become: yes
  roles:
    - harbor

# Bước 4: Khởi tạo K3s Control Plane
- name: Configure K3s Master Node
  hosts: k3s_master
  become: yes
  roles:
    - k3s_master

# Bước 5: Join Worker vào cụm để mở rộng tài nguyên tính toán
- name: Configure K3s Worker Node
  hosts: k3s_worker
  become: yes
  roles:
    - k3s_worker
